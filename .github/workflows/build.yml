name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar projeto
        run: |
          mkdir projeto
          unzip -q ./*.zip -d projeto
          GRADLEW=$(find projeto -name gradlew | head -n 1)
          echo "PROJ_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Compilar
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/*.apk
