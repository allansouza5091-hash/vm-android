name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar projeto
        run: |
          mkdir -p "$GITHUB_WORKSPACE/projeto"
          unzip -q "$GITHUB_WORKSPACE"/*.zip -d "$GITHUB_WORKSPACE/projeto"
          SETTINGS=$(find "$GITHUB_WORKSPACE/projeto" -maxdepth 5 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "Erro: settings.gradle ou settings.gradle.kts nao encontrado."
            exit 1
          fi
          echo "PROJ_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar
        id: compile
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          set +e
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace > "$GITHUB_WORKSPACE/log-build.txt" 2>&1
            EXIT_CODE=$?
          else
            gradle assembleDebug --stacktrace > "$GITHUB_WORKSPACE/log-build.txt" 2>&1
            EXIT_CODE=$?
          fi
          set -e

          echo "===== ERRO PRINCIPAL =====" >> "$GITHUB_STEP_SUMMARY"
          grep -n -A 12 "What went wrong" "$GITHUB_WORKSPACE/log-build.txt" | head -n 30 >> "$GITHUB_STEP_SUMMARY" || true

          if [ $EXIT_CODE -ne 0 ]; then
            echo "FALHOU" > "$GITHUB_WORKSPACE/falhou.txt"
            exit 1
          fi

      - name: Enviar APK e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-e-apk
          path: |
            log-build.txt
            projeto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          
